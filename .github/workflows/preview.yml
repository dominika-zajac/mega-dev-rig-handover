# Plan morning-digest § 3–4. The preview lives only on GitHub Pages, never in git (ADR 0003).
# Run with marker=true for the review copy; run again with marker=false to take the marker off
# the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker (secret LANE_MARKER) in the banner
        type: boolean
        default: false
      night:
        description: Night to preview
        default: '2026-10-28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
        run: scripts/save-preview.sh "${{ inputs.night }}" preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
